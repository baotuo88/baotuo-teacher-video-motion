# Single-host Alpha: durable local database + independent single worker.
services:
  console:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD in .env}
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:?Set a Fernet key in .env}
      DATA_ROOT: /data
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-1024}
      MAX_PENDING_JOBS: ${MAX_PENDING_JOBS:-20}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - runtime-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    init: true
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build: .
    command: [python, -m, app.worker]
    environment:
      DATA_ROOT: /data
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-1024}
      MAX_PENDING_JOBS: ${MAX_PENDING_JOBS:-20}
      RUNTIME_ROOT: /data/runtimes
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:?Set a Fernet key in .env}
    volumes:
      - runtime-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    init: true
    shm_size: 1gb
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; from app.operations import worker_alive; assert worker_alive(Path('/data'))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: 2
    depends_on:
      console:
        condition: service_healthy
volumes:
  runtime-data:
