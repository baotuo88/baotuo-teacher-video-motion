<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>baotuo-teacher-video-motion · 宝拓讲解视频工作台</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/studio.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div id="login" class="login">
      <div class="login-card">
        <div class="brand-icon">宝</div>
        <p class="eyebrow">BAOTUO VIDEO STUDIO</p>
        <h1>让知识，跃然纸上。</h1>
        <p class="muted">从一份分镜，到一段清晰生动的讲解。</p>
        <form id="login-form">
          <label
            >管理员密码<input
              id="password"
              type="password"
              autocomplete="current-password"
              required /></label
          ><button class="primary wide">进入工作台 →</button>
        </form>
        <p id="login-error" role="alert"></p>
      </div>
    </div>
    <div id="app" hidden>
      <aside class="studio-topbar">
        <div class="logo">
          <span class="brand-icon">宝</span>
          <div>宝拓讲解视频<small>AI 讲解视频工作室</small></div>
        </div>
        <nav>
          <button data-nav="projects" class="active">▦　视频项目</button
          ><button data-nav="assets">▧　素材库</button
          ><button data-nav="providers">⚙　模型服务</button
          ><button data-nav="runtimes">◇　Skill 运行时</button
          ><button data-nav="system">◉　运行状态</button>
        </nav>
        <button id="logout" class="quiet">退出登录</button>
      </aside>
      <main>
        <header>
          <div>
            <p class="eyebrow" id="crumb">工作空间 / 视频项目</p>
            <h1 id="heading">我的视频项目</h1>
          </div>
          <button id="new-project" class="primary">＋ 新建视频</button>
        </header>
        <div id="notice" hidden role="alert"></div>
        <div id="content"></div>
      </main>
    </div>
    <dialog id="create-dialog">
      <form id="create-form">
        <h2>开始一个新故事</h2>
        <p class="muted">可以先手动编写，也可以让模型生成分镜。</p>
        <label
          >项目名称<input
            name="title"
            required
            maxlength="60"
            placeholder="例如：一支铅笔是怎样做出来的" /></label
        ><label
          >讲解要求<textarea
            name="topic"
            rows="4"
            maxlength="5000"
            placeholder="讲给谁听？重点讲什么？"
          ></textarea>
        </label>
        <div class="actions">
          <button type="button" id="close-create">取消</button
          ><button class="primary">创建项目</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
